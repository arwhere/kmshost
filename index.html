<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Update</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #06070d;
  }

  /* ---------- Animated background ---------- */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.55;
    will-change: transform;
  }

  .blob-1 {
    width: 520px; height: 520px;
    background: radial-gradient(circle, #5b6cff, transparent 70%);
    top: -160px; left: -140px;
    animation: drift1 18s ease-in-out infinite;
  }
  .blob-2 {
    width: 480px; height: 480px;
    background: radial-gradient(circle, #b64bff, transparent 70%);
    bottom: -180px; right: -120px;
    animation: drift2 22s ease-in-out infinite;
  }
  .blob-3 {
    width: 420px; height: 420px;
    background: radial-gradient(circle, #00d4ff, transparent 70%);
    top: 40%; left: 55%;
    animation: drift3 26s ease-in-out infinite;
  }

  @keyframes drift1 {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(120px, 90px) scale(1.15); }
  }
  @keyframes drift2 {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(-110px, -70px) scale(1.2); }
  }
  @keyframes drift3 {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(-90px, 80px) scale(1.1); }
  }

  /* Grid overlay */
  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(circle at 50% 50%, black 20%, transparent 75%);
    -webkit-mask-image: radial-gradient(circle at 50% 50%, black 20%, transparent 75%);
  }

  /* Floating particles */
  .particle {
    position: absolute;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: rgba(255,255,255,0.7);
    box-shadow: 0 0 10px rgba(120,160,255,0.9);
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0%   { transform: translateY(100vh) scale(0.4); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  /* ---------- Content ---------- */
  .wrapper {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    position: relative;
    max-width: 560px;
    width: 100%;
    padding: 56px 44px 48px;
    text-align: center;
    border-radius: 28px;
    background: linear-gradient(160deg, rgba(255,255,255,0.09), rgba(255,255,255,0.03));
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    box-shadow:
      0 30px 80px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.15);
    animation: cardIn 1s cubic-bezier(.22,.9,.28,1) both;
    overflow: hidden;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(40px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Animated border glow */
  .card::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 30px;
    background: conic-gradient(from 0deg,
      transparent 0deg,
      rgba(120,140,255,0.9) 60deg,
      rgba(200,90,255,0.9) 120deg,
      transparent 180deg,
      transparent 360deg);
    z-index: -1;
    animation: spin 6s linear infinite;
    filter: blur(14px);
    opacity: 0.45;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Icon */
  .icon-wrap {
    position: relative;
    width: 96px;
    height: 96px;
    margin: 0 auto 34px;
    animation: fadeUp 1s 0.25s both;
  }

  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: #7a8cff;
    border-right-color: #c25aff;
    animation: spin 2.2s linear infinite;
  }
  .ring:nth-child(2) {
    inset: 10px;
    border-top-color: #00d4ff;
    border-right-color: transparent;
    animation-duration: 1.6s;
    animation-direction: reverse;
  }
  .ring:nth-child(3) {
    inset: 20px;
    border-top-color: #ff5ab6;
    animation-duration: 3s;
  }

  .icon-core {
    position: absolute;
    inset: 30px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #8fa0ff, #5a3bd4);
    box-shadow: 0 0 30px rgba(120,140,255,0.85), inset 0 0 12px rgba(255,255,255,0.4);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%,100% { transform: scale(1); box-shadow: 0 0 30px rgba(120,140,255,0.85), inset 0 0 12px rgba(255,255,255,0.4); }
    50%     { transform: scale(1.12); box-shadow: 0 0 50px rgba(160,120,255,1), inset 0 0 18px rgba(255,255,255,0.6); }
  }

  /* Badge */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 8px 18px;
    border-radius: 100px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #b9c2e8;
    margin-bottom: 26px;
    animation: fadeUp 1s 0.35s both;
  }

  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 10px #4ade80;
    animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink {
    0%,100% { opacity: 1; transform: scale(1); }
    50%     { opacity: 0.35; transform: scale(0.8); }
  }

  /* Title */
  h1 {
    font-size: clamp(26px, 5vw, 38px);
    line-height: 1.25;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 18px;
    background: linear-gradient(100deg, #ffffff 20%, #9fb0ff 45%, #d79bff 60%, #ffffff 85%);
    background-size: 250% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: fadeUp 1s 0.45s both, shine 5s linear infinite 1.2s;
  }

  @keyframes shine {
    to { background-position: -250% center; }
  }

  /* Subtitle */
  p {
    font-size: clamp(15px, 2.4vw, 17px);
    line-height: 1.65;
    color: #9aa3c7;
    margin-bottom: 38px;
    animation: fadeUp 1s 0.55s both;
  }

  p strong {
    color: #e3e7ff;
    font-weight: 600;
  }

  /* Loading bar */
  .loader {
    position: relative;
    width: 100%;
    max-width: 320px;
    height: 5px;
    margin: 0 auto 22px;
    border-radius: 100px;
    background: rgba(255,255,255,0.07);
    overflow: hidden;
    animation: fadeUp 1s 0.65s both;
  }

  .loader-fill {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    width: 40%;
    border-radius: 100px;
    background: linear-gradient(90deg, #5b6cff, #b64bff, #00d4ff);
    box-shadow: 0 0 16px rgba(140,120,255,0.9);
    animation: slide 2.4s cubic-bezier(.65,.05,.36,1) infinite;
  }

  @keyframes slide {
    0%   { left: -40%; width: 40%; }
    50%  { left: 30%;  width: 55%; }
    100% { left: 100%; width: 40%; }
  }

  /* Status dots */
  .dots {
    display: flex;
    gap: 8px;
    justify-content: center;
    animation: fadeUp 1s 0.75s both;
  }

  .dots span {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #6b78c9;
    animation: bounce 1.3s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.18s; }
  .dots span:nth-child(3) { animation-delay: 0.36s; }

  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); opacity: 0.45; }
    30%         { transform: translateY(-7px); opacity: 1; }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Responsive */
  @media (max-width: 480px) {
    .card { padding: 44px 26px 38px; border-radius: 22px; }
    .icon-wrap { width: 78px; height: 78px; margin-bottom: 26px; }
    .icon-core { inset: 24px; }
  }
</style>
</head>
<body>

<div class="bg">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="grid-overlay"></div>
  <div id="particles"></div>
</div>

<div class="wrapper">
  <div class="card">
    <div class="icon-wrap">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="icon-core"></div>
    </div>

    <div class="badge">
      <span class="dot"></span>
      Maintenance in progress
    </div>

    <h1>We are updating the service.</h1>

    <p>KMS activation is <strong>not available yet</strong>.<br>
       Please check back soon — we're working on it.</p>

    <div class="loader"><div class="loader-fill"></div></div>

    <div class="dots">
      <span></span><span></span><span></span>
    </div>
  </div>
</div>

<script>
  // Generate floating particles
  const container = document.getElementById('particles');
  const count = 28;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 3 + 2;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (Math.random() * 14 + 12) + 's';
    p.style.animationDelay = (Math.random() * -20) + 's';
    p.style.opacity = Math.random() * 0.6 + 0.2;
    container.appendChild(p);
  }
</script>

</body>
</html>
